[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-data-synchronizer"
dynamic = ["version"]
description = "Desktop tool for aligning video with numeric time-series data and exporting synchronized visualizations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Perkinson" }]
keywords = ["time-series", "video", "synchronization", "scientific-data", "visualization", "photometry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  # PySide6 6.12.0 has a refcount bug that aborts Python 3.10/3.11 on
  # shutdown. True/False/None are immortal on 3.12+, so newer PySide6 is
  # safe there; see https://github.com/IAmTomShaw/f1-race-replay/issues/364.
  "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",
  "PySide6-Essentials>=6.6,<7; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  # NumPy 2.5+ stubs use Python 3.12 syntax; keep mypy aligned with Python 3.11 support.
  "numpy>=1.26,<2.5",
  "mypy>=1.10,<2",
  "pyright>=1.1.414,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff==0.17.0",
  "twine>=5,<7",
]

[project.urls]
Repository = "https://github.com/Michael-Perkinson/video-data-synchronizer"
Documentation = "https://github.com/Michael-Perkinson/video-data-synchronizer/tree/main/docs"

[project.gui-scripts]
video-data-sync = "video_data_sync.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "video_data_sync.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_data_sync*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["Example data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["video_data_sync"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
